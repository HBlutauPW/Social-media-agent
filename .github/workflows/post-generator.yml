name: 🤖 Social Media Post Generator

on:
  schedule:
    - cron: '0 10 * * 1'
    - cron: '0 10 * * 3'
    - cron: '0 10 * * 5'
  workflow_dispatch:
    inputs:
      tipo:
        description: 'Pilar de conteúdo'
        required: true
        default: 'ia_news'
        type: choice
        options:
          - portfolio
          - ia_news
          - mercado
          - opiniao
          - bastidores
      idioma:
        description: 'Idioma dos posts'
        required: true
        default: 'pt+en'
        type: choice
        options:
          - 'pt+en'
          - 'pt'
          - 'en'
      material:
        description: 'Material bruto'
        required: false
        default: ''

jobs:
  generate-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Chamar agente e gerar post
        run: |
          echo "Chamando: ${{ secrets.VERCEL_URL }}/api/generate"
          
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.VERCEL_URL }}/api/generate" \
            -H "Content-Type: application/json" \
            -H "X-Secret: ${{ secrets.AGENT_SECRET }}" \
            -d "{\"tipo\":\"${{ github.event.inputs.tipo || 'ia_news' }}\",\"idioma\":\"${{ github.event.inputs.idioma || 'pt+en' }}\",\"material\":\"
