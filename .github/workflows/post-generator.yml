name: 🤖 Social Media Post Generator

on:
  workflow_dispatch:
    inputs:
      tipo:
        description: 'Pilar de conteúdo'
        required: true
        default: 'ia_news'
        type: choice
        options:
          - ia_news
          - portfolio
          - mercado
          - opiniao
      idioma:
        description: 'Idioma'
        required: true
        default: 'pt+en'
        type: choice
        options:
          - 'pt+en'
          - 'pt'
          - 'en'

jobs:
  generate-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar post via agente
        env:
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
          AGENT_SECRET: ${{ secrets.AGENT_SECRET }}
          TIPO: ${{ github.event.inputs.tipo }}
          IDIOMA: ${{ github.event.inputs.idioma }}
        run: |
          echo "Chamando agente..."
          curl -v -X POST "$VERCEL_URL/api/generate" \
            -H "Content-Type: application/json" \
            -H "X-Secret: $AGENT_SECRET" \
            -d "{\"tipo\":\"$TIPO\",\"idioma\":\"$IDIOMA\",\"material\":\"\"}" \
            -o draft.json
          echo "--- Conteúdo do draft.json ---"
          cat draft.json

      - name: Salvar draft
        env:
          TIPO: ${{ github.event.inputs.tipo }}
        run: python3 scripts/save_draft.py
